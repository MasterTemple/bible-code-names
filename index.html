<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <title>Bible Code Names</title>
    <script>
      // Resolve the theme before first paint (theme.ts takes over after load).
      try {
        // Carry saved data over from the old "Scripture Spies" key prefix.
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i)
          if (k && k.indexOf('scripture-spies:') === 0) {
            var nk = 'bible-code-names:' + k.slice(16)
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k))
            localStorage.removeItem(k)
          }
        }
        var t = localStorage.getItem('bible-code-names:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
